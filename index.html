
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장소 검색 지도</title>

  <style>
    /* 기본 페이지 설정 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #222;
      background: #f5f6f8;
    }

    /* 화면을 왼쪽과 오른쪽으로 분할 */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* 왼쪽 검색 영역 */
    .sidebar {
      width: 380px;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      background: white;
      border-right: 1px solid #ddd;
      z-index: 2;
    }

    .header {
      padding: 24px 20px 16px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .header p {
      margin: 0;
      color: #777;
      font-size: 13px;
    }

    /* 검색창과 버튼 */
    .search-form {
      display: flex;
      gap: 8px;
      padding: 0 20px 16px;
    }

    .search-form input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .search-form input:focus {
      border-color: #3182f6;
    }

    .search-form button {
      padding: 0 16px;
      border: none;
      border-radius: 8px;
      color: white;
      background: #3182f6;
      cursor: pointer;
      font-weight: bold;
    }

    .search-form button:hover {
      background: #1765cc;
    }

    /* 검색 상태 안내 */
    #status {
      padding: 0 20px 12px;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    /* 검색 결과 목록 */
    #resultList {
      flex: 1;
      overflow-y: auto;
      border-top: 1px solid #eee;
    }

    .place-item {
      padding: 16px 20px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background 0.15s;
    }

    .place-item:hover {
      background: #f3f7ff;
    }

    .place-item h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .place-item p {
      margin: 4px 0;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    .place-item a {
      display: inline-block;
      margin-top: 8px;
      color: #3182f6;
      font-size: 13px;
      text-decoration: none;
    }

    /* 오른쪽 지도 영역 */
    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: #e8edf2;
    }

    /* 화면이 좁을 때 레이아웃 조정 */
    @media (max-width: 650px) {
      .sidebar {
        width: 45%;
        min-width: 180px;
      }

      .header {
        padding: 16px 12px;
      }

      .header h1 {
        font-size: 19px;
      }

      .search-form {
        padding: 0 10px 12px;
        gap: 5px;
      }

      .search-form input {
        padding: 10px 6px;
        font-size: 12px;
      }

      .search-form button {
        padding: 0 9px;
        font-size: 12px;
      }

      #status {
        padding: 0 10px 10px;
      }

      .place-item {
        padding: 12px 10px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- 왼쪽 검색창과 결과 목록 -->
    <aside class="sidebar">
      <div class="header">
        <h1>장소 찾기</h1>
        <p>원하는 장소를 검색해 보세요.</p>
      </div>

      <form class="search-form" id="searchForm">
        <input
          type="text"
          id="searchInput"
          placeholder="장소 또는 키워드 입력"
          aria-label="검색할 장소"
          required
        >
        <button type="submit" id="searchButton">검색</button>
      </form>

      <div id="status" role="status" aria-live="polite">
        지도를 불러오는 중입니다.
      </div>

      <div id="resultList"></div>
    </aside>

    <!-- 오른쪽 지도 -->
    <main id="map" aria-label="장소 검색 지도"></main>

  </div>

  <!-- 카카오 지도 SDK와 장소 검색 라이브러리 -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=11a56469b67306e63016649e688605c8&libraries=services&autoload=false"
    onerror="document.getElementById('status').textContent='지도 SDK를 불러오지 못했습니다. API 키와 네트워크를 확인하세요.'"
  ></script>

  <script>
    // 지도와 검색에 필요한 변수
    let map = null;
    let places = null;
    let currentMarker = null;
    let searchMarkers = [];
    let infoWindow = null;
    let currentPosition = null;
    let mapReady = false;

    // HTML 요소를 가져옵니다.
    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const resultList = document.getElementById("resultList");
    const statusElement = document.getElementById("status");

    // 상태 메시지를 변경합니다.
    function setStatus(message) {
      statusElement.textContent = message;
    }

    // 지도 SDK가 준비된 후에 지도 초기화를 시작합니다.
    function initializeMap() {
      const defaultPosition = new kakao.maps.LatLng(
        37.566826,
        126.9786567
      );

      // 지도를 생성하고 확대 레벨을 5로 설정합니다.
      map = new kakao.maps.Map(
        document.getElementById("map"),
        {
          center: defaultPosition,
          level: 5
        }
      );

      // 장소 검색 객체와 정보 창을 생성합니다.
      places = new kakao.maps.services.Places(map);
      infoWindow = new kakao.maps.InfoWindow({
        zIndex: 10
      });

      // 지도 생성 이후 현재 위치를 확인합니다.
      mapReady = true;
      setStatus("현재 위치를 확인하고 있습니다.");

      requestCurrentLocation();
    }

    // 브라우저에 현재 위치 권한을 요청합니다.
    function requestCurrentLocation() {
      if (!navigator.geolocation) {
        setStatus("이 브라우저에서는 위치 정보를 사용할 수 없습니다.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (position) {
          // 현재 위치의 위도와 경도를 가져옵니다.
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          currentPosition = new kakao.maps.LatLng(
            latitude,
            longitude
          );

          // 현재 위치로 지도를 이동합니다.
          map.setCenter(currentPosition);

          // 현재 위치 마커를 생성합니다.
          currentMarker = new kakao.maps.Marker({
            map: map,
            position: currentPosition,
            title: "내 현재 위치"
          });

          setStatus("현재 위치를 표시했습니다. 장소를 검색해 보세요.");
        },
        function (error) {
          // 위치 정보를 가져오지 못한 경우 기본 위치를 유지합니다.
          const messages = {
            1: "위치 권한이 거부되었습니다. 브라우저 설정에서 허용할 수 있습니다.",
            2: "현재 위치를 확인할 수 없습니다. 기본 위치에서 시작합니다.",
            3: "위치 확인 시간이 초과되었습니다. 기본 위치에서 시작합니다."
          };

          setStatus(
            messages[error.code] ||
            "위치를 확인하지 못했습니다. 기본 위치에서 시작합니다."
          );
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    // 이전 검색 마커를 지도에서 제거합니다.
    function clearSearchMarkers() {
      searchMarkers.forEach(function (marker) {
        marker.setMap(null);
      });

      searchMarkers = [];
      infoWindow.close();
    }

    // 검색 결과에 해당하는 마커를 생성합니다.
    function displayMarker(place) {
      const position = new kakao.maps.LatLng(
        Number(place.y),
        Number(place.x)
      );

      const marker = new kakao.maps.Marker({
        map: map,
        position: position,
        title: place.place_name
      });

      searchMarkers.push(marker);

      // 마커를 클릭하면 장소 이름을 표시합니다.
      kakao.maps.event.addListener(marker, "click", function () {
        infoWindow.setContent(
          '<div style="padding:10px;font-size:13px;">' +
          escapeHTML(place.place_name) +
          "</div>"
        );

        infoWindow.open(map, marker);
      });

      return marker;
    }

    // HTML에 표시할 문자열의 특수문자를 처리합니다.
    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, function (character) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };

        return entities[character];
      });
    }

    // 검색 결과 목록을 화면에 표시합니다.
    function displayPlaces(data) {
      resultList.replaceChildren();

      data.forEach(function (place, index) {
        const item = document.createElement("article");
        item.className = "place-item";

        const name = document.createElement("h3");
        name.textContent = (index + 1) + ". " + place.place_name;

        const category = document.createElement("p");
        category.textContent = place.category_name || "분류 정보 없음";

        const address = document.createElement("p");
        address.textContent =
          place.road_address_name ||
          place.address_name ||
          "주소 정보 없음";

        const phone = document.createElement("p");
        phone.textContent = place.phone || "전화번호 정보 없음";

        const link = document.createElement("a");
        link.textContent = "카카오맵에서 보기";
        link.href = place.place_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        // 링크 클릭은 지도 이동 이벤트로 이어지지 않도록 처리합니다.
        link.addEventListener("click", function (event) {
          event.stopPropagation();
        });

        // 각 결과를 클릭하면 지도 중심을 해당 장소로 이동합니다.
        item.addEventListener("click", function () {
          const position = new kakao.maps.LatLng(
            Number(place.y),
            Number(place.x)
          );

          map.panTo(position);

          // 기존 정보 창을 닫고 선택한 장소의 정보를 표시합니다.
          infoWindow.close();
          infoWindow.setContent(
            '<div style="padding:10px;font-size:13px;">' +
            escapeHTML(place.place_name) +
            "</div>"
          );
          infoWindow.open(map, searchMarkers[index]);
        });

        item.append(name, category, address, phone, link);
        resultList.appendChild(item);
      });
    }

    // 입력한 키워드로 장소를 검색합니다.
    function searchPlaces(keyword) {
      if (!mapReady || !places) {
        setStatus("지도가 준비될 때까지 기다려 주세요.");
        return;
      }

      const query = keyword.trim();

      if (!query) {
        setStatus("검색할 장소를 입력해 주세요.");
        return;
      }

      searchButton.disabled = true;
      setStatus("장소를 검색하고 있습니다.");
      resultList.replaceChildren();
      clearSearchMarkers();

      // 장소 검색 결과를 받습니다.
      places.keywordSearch(
        query,
        function (data, status) {
          searchButton.disabled = false;

          if (status === kakao.maps.services.Status.OK) {
            // 검색된 장소에 마커를 표시합니다.
            const bounds = new kakao.maps.LatLngBounds();

            data.forEach(function (place) {
              displayMarker(place);

              bounds.extend(
                new kakao.maps.LatLng(
                  Number(place.y),
                  Number(place.x)
                )
              );
            });

            // 검색 결과 목록을 표시합니다.
            displayPlaces(data);

            // 검색 결과가 모두 보이도록 지도 범위를 조정합니다.
            if (data.length > 0) {
              map.setBounds(bounds);
            }

            setStatus("검색 결과 " + data.length + "개를 찾았습니다.");
          } else if (
            status === kakao.maps.services.Status.ZERO_RESULT
          ) {
            setStatus("검색 결과가 없습니다. 다른 키워드를 입력해 보세요.");
          } else {
            setStatus("검색 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
          }
        },
        {
          // 현재 위치가 있으면 가까운 장소를 우선 검색합니다.
          location: currentPosition || map.getCenter(),
          sort: kakao.maps.services.SortBy.DISTANCE,
          size: 15
        }
      );
    }

    // 검색 버튼을 누르거나 Enter를 입력하면 검색합니다.
    searchForm.addEventListener("submit", function (event) {
      event.preventDefault();
      searchPlaces(searchInput.value);
    });

    // SDK가 로드된 후 지도 초기화를 실행합니다.
    // autoload=false를 사용했으므로 kakao.maps.load()가 필요합니다.
    if (window.kakao && window.kakao.maps) {
      kakao.maps.load(function () {
        try {
          initializeMap();
        } catch (error) {
          console.error("지도 초기화 오류:", error);
          setStatus("지도를 초기화하지 못했습니다. API 설정을 확인하세요.");
        }
      });
    } else {
      setStatus("카카오 지도 SDK를 불러오지 못했습니다. API 키와 네트워크를 확인하세요.");
    }
  </script>
</body>
</html>
